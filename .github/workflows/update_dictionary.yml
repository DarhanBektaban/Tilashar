name: Update Dictionary and Find New Words

on:
  push:
    paths:
      - 'zhagna.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process-words:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Python script to diff and merge
        run: |
          python3 - << 'EOF'
          import os
          import unicodedata
          import re

          zhagna_file = "zhagna.txt"
          main_file = "zhuikteldi.txt"
          check_file = "tekseruu.txt"

          def clean_word(text):
              # 1. Unicode normalizatsiia (NFC)
              text = unicodedata.normalize('NFC', text)

              # 2. Barlyq korinbejtin jasyryn tanbalardy (Zero-width space \u200b, soft hyphen, t.b.) oshiru
              # unicodedata 'Cf' (Format), 'Cc' (Control), 'Cs' (Surrogate) tanbalaryn qyryp tastajdy
              text = "".join(ch for ch in text if unicodedata.category(ch) not in ('Cf', 'Cc', 'Cs'))

              # 3. Non-breaking space (\u00a0, \u202f t.b.) standart probelge auystyryp, shetindegi probelderdi qyrqu
              text = re.sub(r'[\s\u00a0\u2000-\u200b\u202f\u205f\u3000]+', ' ', text).strip()

              # 4. Kishi aripke keltiru
              return text.lower()

          def read_clean_words(filename):
              if not os.path.exists(filename):
                  return set()
              words = set()
              with open(filename, "r", encoding="utf-8-sig", errors="ignore") as f:
                  for line in f:
                      cleaned = clean_word(line)
                      if cleaned:
                          words.add(cleaned)
              return words

          # 1. Negizgi sozdikti oqu
          main_words = read_clean_words(main_file)

          # 2. Zhagna qosylghan sozderdi oqu
          new_input_words = read_clean_words(zhagna_file)

          if not new_input_words:
              print("zhagna.txt bos nemese tabylmady.")
              exit(0)

          # 3.zhuikteldi.txt ishinde SHYNYMEN joq sozder
          truly_new_words = sorted(list(new_input_words - main_words))

          # 4. tekseruu.txt fajlyna tek zhagna sozderdi jazyp shyghu
          with open(check_file, "w", encoding="utf-8") as f:
              for word in truly_new_words:
                  f.write(word + "\n")

          # 5. zhuikteldi.txt tizimin tolyq qosyp, taza alfavittiq retpen (A-Z) saqtau
          all_words = sorted(list(main_words.union(new_input_words)))
          with open(main_file, "w", encoding="utf-8") as f:
              for word in all_words:
                  f.write(word + "\n")

          # 6. zhagna.txt fajlyn bosatu
          open(zhagna_file, "w", encoding="utf-8").close()

          print(f"Barlyq korinbejtin tanbalar tazartyldy.")
          print(f"Zhagna sozder: {len(truly_new_words)}")
          print(f"Barlyghy zhuikteldi.txt ishinde: {len(all_words)}")
          EOF

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add zhuikteldi.txt tekseruu.txt zhagna.txt
          git diff --staged --quiet || (git commit -m "Auto: Sanitize invisible chars, sort and update" && git push)
