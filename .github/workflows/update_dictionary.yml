name: Update Dictionary and Find New Words

on:
  push:
    paths:
      - 'zhagna.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process-words:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Python script to diff and merge
        run: |
          python3 - << 'EOF'
          import os

          zhagna_file = "zhagna.txt"
          main_file = "zhuikteldi.txt"
          check_file = "tekseruu.txt"

          def read_clean_words(filename):
              if not os.path.exists(filename):
                  return set()
              # 'utf-8-sig' arqyly jasyryn BOM belgisin birden qyryp tastajmyz
              with open(filename, "r", encoding="utf-8-sig") as f:
                  words = set()
                  for line in f:
                      # .strip() barlyq probel, tab, \r, \n tańbalaryn tazartady
                      cleaned = line.strip().lower()
                      if cleaned:
                          words.add(cleaned)
                  return words

          # 1. Bar sózderdi oqyp alamyz
          main_words = read_clean_words(main_file)

          # 2. Jańa kelgen sózderdi oqyp alamyz
          new_input_words = read_clean_words(zhagna_file)

          if not new_input_words:
              print("zhagna.txt bos nemese tabylmady.")
              exit(0)

          # 3. zhuikteldi.txt ishinde SHYNYMEN joq sózder
          truly_new_words = sorted(list(new_input_words - main_words))

          # 4. tekseruu.txt fajlyna tek jańa sózderdi jazamyz
          with open(check_file, "w", encoding="utf-8") as f:
              for word in truly_new_words:
                  f.write(word + "\n")

          # 5. zhuikteldi.txt fajlyna qosyp, alfavıtpen rettep jazamyz
          all_words = sorted(list(main_words.union(new_input_words)))
          with open(main_file, "w", encoding="utf-8") as f:
              for word in all_words:
                  f.write(word + "\n")

          # 6. zhagna.txt fajlyn taza qaldyramyz
          open(zhagna_file, "w", encoding="utf-8").close()

          print(f"Anyqtalǵan jańa sózder sany: {len(truly_new_words)}")
          print(f"Barlyq sózder sany: {len(all_words)}")
          EOF

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add zhuikteldi.txt tekseruu.txt zhagna.txt
          git diff --staged --quiet || (git commit -m "Auto: Update zhuikteldi.txt and generated tekseruu.txt" && git push)
